# cargo-deny 配置（CI 依赖审查）
# 安装: cargo install cargo-deny
#
# 注：cargo-deny v2 配置格式只有**顶层** `version`；各节（[advisories] 等）
# 不接受 `version = 2`（旧 v1 风格，v2 解析器直接报错，见审计）。

version = 2

[advisories]
yanked = "warn"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "GPL-3.0-or-later",
]
# GPL 项目自身许可
private = { ignore = true }

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
