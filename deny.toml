# cargo-deny 配置（CI 依赖审查）
# 安装: cargo install cargo-deny
# 本地验证: cargo-deny --log-level warn --manifest-path ./Cargo.toml --all-features check
#
# 顶层只接受配置节（advisories/bans/licenses/sources/...），没有 `version` 键；
# 写 `version = 2` 会被解析器以 unexpected-keys 拒绝（CI 实测报错），故不写。

[advisories]
yanked = "warn"
# 以下通报均为传递依赖、无兼容修复版本，且不影响本项目运行时安全边界：
# - RUSTSEC-2021-0139 ansi_term / RUSTSEC-2024-0375 atty：
#   clap v2 → dbus-codegen → ksni 0.2.2 的构建期工具链（仅 build-dependencies）。
# - RUSTSEC-2024-0436 paste：lofty / image(exr→pulp) / rav1e 传递依赖。
# - RUSTSEC-2026-0206 rustybuzz / RUSTSEC-2026-0192 ttf-parser：
#   resvg（slint SVG 渲染）传递依赖，替代品需上游换用 skrifa/harfrust。
# - RUSTSEC-2026-0194 / RUSTSEC-2026-0195 quick-xml：
#   zbus_xml 5.1 锁定 quick-xml 0.38；修复需 zbus_xml ≥5.2（MSRV 1.87）。
#   本项目仅经 zbus 解析本地会话总线 introspection XML，非攻击者输入。
# - RUSTSEC-2026-0009 time：修复版 0.3.47+ 要求 rust ≥1.88（本工作区 MSRV 1.85）；
#   cookie 解析仅用于出站 HTTP 响应，本地播放器场景风险低。
# 若后续提升 MSRV（≥1.88），应优先 `cargo update -p time -p zbus_xml` 再移除对应 ignore。
ignore = [
    "RUSTSEC-2021-0139",
    "RUSTSEC-2024-0375",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2026-0192",
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    "RUSTSEC-2026-0206",
    "RUSTSEC-2026-0009",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "GPL-3.0-or-later",
    # 以下为传递依赖引入的宽松许可：
    "BSD-2-Clause", # arrayref / rav1e / av1-grain / v_frame（image→ravif→rav1e）
    "BSL-1.0", # clipboard-win / error-code（copypasta 剪贴板，winit 依赖）
    "Unlicense", # ksni 0.2.2 / 0.3.6（系统托盘）
    "CDLA-Permissive-2.0", # webpki-roots 1.0.9（reqwest TLS 根证书，自 1.0 起改此许可）
    "Apache-2.0 WITH LLVM-exception", # target-lexicon（system-deps / cfg-expr）
    "NCSA", # libfuzzer-sys：license 为 (MIT OR Apache-2.0) AND NCSA，MIT/Apache-2.0 已允许
    "GPL-3.0-only", # slint 系：GPL-3.0-only OR LicenseRef-Slint-Royalty-free-2.0 OR LicenseRef-Slint-Software-3.0，本项目按 GPL 条款使用
]
# GPL 项目自身许可
private = { ignore = true }

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
