# cargo-deny 配置（CI 依赖审查）
# 安装: cargo install cargo-deny
# 本地验证: cargo-deny --log-level warn --manifest-path ./Cargo.toml --all-features check
#
# 顶层只接受配置节（advisories/bans/licenses/sources/...），没有 `version` 键；
# 写 `version = 2` 会被解析器以 unexpected-keys 拒绝（CI 实测报错），故不写。

[advisories]
yanked = "warn"
# 以下通报均为传递依赖、无兼容修复版本，且不影响本项目运行时安全边界
# （S11 终态 lock 复核后收敛：ksni 0.3 链使 ansi_term/atty/dbus-codegen 出图、
#  rustybuzz 出图、time 0.3.55 与 quick-xml 0.41 已是修复版，故删对应 ignore）：
# - RUSTSEC-2024-0436 paste：lofty 0.25.4 仍携带，无修复版。
# - RUSTSEC-2026-0192 ttf-parser 0.25.1：slint 链（owned_ttf_parser）传入，
#   替代品需上游换用 skrifa/harfrust。
# - RUSTSEC-2024-0370 proc-macro-error（unmaintained）：gtk-rs 0.18 线
#   glib-macros / gtk3-macros 传递依赖，经 tray-icon→libappindicator→gtk 传入；
#   无兼容修复（gtk3-macros 0.18 仍绑定 syn 1 生态），需上游 gtk-rs 升级才能根除。
ignore = [
    "RUSTSEC-2024-0436",
    "RUSTSEC-2024-0370",
    "RUSTSEC-2026-0192",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "GPL-3.0-or-later",
    # 以下为传递依赖引入的宽松许可：
    "BSD-2-Clause", # arrayref / rav1e / av1-grain / v_frame（image→ravif→rav1e）
    "BSL-1.0", # clipboard-win / error-code（copypasta 剪贴板，winit 依赖）
    "Unlicense", # ksni 0.2.2 / 0.3.6（系统托盘）
    "CC0-1.0", # notify 6.1.1（文件监听，公共领域豁免式许可）
    "MPL-2.0", # symphonia 0.5.x 音频解码全家桶 + option-ext（dirs→notify），文件级 copyleft，与 GPLv3 兼容
    "CDLA-Permissive-2.0", # webpki-roots 1.0.9（reqwest TLS 根证书，自 1.0 起改此许可）
    "Apache-2.0 WITH LLVM-exception", # target-lexicon（system-deps / cfg-expr）
    "NCSA", # libfuzzer-sys：license 为 (MIT OR Apache-2.0) AND NCSA，MIT/Apache-2.0 已允许
    "GPL-3.0-only", # slint 系：GPL-3.0-only OR LicenseRef-Slint-Royalty-free-2.0 OR LicenseRef-Slint-Software-3.0，本项目按 GPL 条款使用
]
# GPL 项目自身许可
private = { ignore = true }

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
