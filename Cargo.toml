# HMP 工作区根清单
#
# 结构决策（docs/PROJECT.md §5 及项目讨论记录）：
# - 单 Git 仓库 + 单 Cargo workspace
# - crates/hmp-qqmusic-api 是独立 package：独立版本号、独立 crates.io 发布
# - 暂不拆分独立 Git 仓库 / 不引入 submodule；
#   当 API 出现外部使用者、发布节奏分化或独立维护需求时再拆仓迁移历史
[workspace]
members = ["crates/hmp-cli", "crates/hmp-core", "crates/hmp-daemon", "crates/hmp-desktop", "crates/hmp-media", "crates/hmp-mpris", "crates/hmp-player", "crates/hmp-qqmusic-api", "crates/hmp-smtc", "crates/hmp-storage"]
# workspace 根 `cargo run` 默认运行 hmp（遥控命令），`cargo run --bin hmp-desktop` 跑桌面端。
default-members = ["crates/hmp-cli"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
# TODO(发布前): 替换为真实仓库地址
repository = "https://github.com/modenicheng/hutao-music-player"
# MSRV 定实 = 全图依赖 rust_version 顶点（slint 1.18 链，cargo metadata 聚合核实，S11）
rust-version = "1.92"

[workspace.dependencies]
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
keyring = "4.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
slint = "1.18"
zbus = "6"
bytes = "1"
flate2 = "1"
futures-util = "0.3"
lofty = "0.25"
rusqlite = { version = "0.40", features = ["bundled"] }
toml = "1"
# reqwest 0.13: `query`/`form` 移入 feature；`rustls-tls` 拆为 `rustls`+`webpki-roots`；
# `system-proxy` 开 OS 级代理读取（no_proxy() 调用点不受影响——0.13 语义=清 proxies+禁自动系统代理，S11 审核实证）
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "cookies",
    "gzip",
    "brotli",
    "deflate",
    "rustls",
    "webpki-roots",
    "system-proxy",
    "stream",
    "query",
    "form",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.11"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "fs",
] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
notify = "8"
hmp-core = { path = "crates/hmp-core" }
hmp-storage = { path = "crates/hmp-storage" }

# 仅测试用
wiremock = "0.6"
