# HMP 工作区根清单
#
# 结构决策（docs/PROJECT.md §5 及项目讨论记录）：
# - 单 Git 仓库 + 单 Cargo workspace
# - crates/hmp-qqmusic-api 是独立 package：独立版本号、独立 crates.io 发布
# - 暂不拆分独立 Git 仓库 / 不引入 submodule；
#   当 API 出现外部使用者、发布节奏分化或独立维护需求时再拆仓迁移历史
[workspace]
members = ["crates/hmp-qqmusic-api"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
# TODO(发布前): 替换为真实仓库地址
repository = "https://github.com/<owner>/hutao-music-player"
rust-version = "1.85"

[workspace.dependencies]
base64 = "0.22"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "cookies",
    "gzip",
    "brotli",
    "deflate",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "fs",
] }
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"

# 仅测试用
wiremock = "0.6"
