[package]
name = "hmp-cli"
description = "HMP 命令行客户端：hmp login / search / 遥控后端播放（docs/PROJECT.md §20 里程碑）"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# 二进制命名为 `hmp`（与 clap 命令名、文档用法一致；`CARGO_BIN_EXE_hmp` 供集成测试）。
# 默认二进制（`cargo run` 消歧）。
default-run = "hmp"
[[bin]]
name = "hmp"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
hmp-core = { path = "../hmp-core" }
# tray：`hmp serve`（桌面端/CLI 共同的后端宿主）默认带系统托盘——
# detached 后台进程无控制台，托盘是主要的手动控制/退出入口。
hmp-daemon = { path = "../hmp-daemon", features = ["tray"] }
hmp-qqmusic-api = { path = "../hmp-qqmusic-api" }
hmp-storage = { path = "../hmp-storage" }
rusqlite = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# mpris：`hmp-daemon/mpris` 是可选 feature，且自 94c2c95 起不在默认集里，此后
# 没有任何依赖方打开它——按文档里的命令（`cargo build --release` /
# `-p hmp-desktop -p hmp-cli`）构建出的二进制不带 MPRIS，而 `--all-features` 的
# clippy 每次都过，掩盖了这一点（AUDIT §30.7）。daemon 跑在 `hmp serve`
# （本 crate）进程里，Linux 系统媒体控制必须在这里打开；Windows 走 SMTC
# （`cfg(windows)` 模块，不受 feature 门控），不启用。
[target.'cfg(not(windows))'.dependencies]
hmp-daemon = { path = "../hmp-daemon", features = ["mpris"] }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = "3"
