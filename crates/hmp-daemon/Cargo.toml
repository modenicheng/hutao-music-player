[package]
name = "hmp-daemon"
description = "HMP 跨平台后台播放服务"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "hmpd"
path = "src/main.rs"

[dependencies]
hmp-core = { path = "../hmp-core" }
hmp-control = { path = "../hmp-control" }
clap.workspace = true
hmp-player = { path = "../hmp-player" }
hmp-qqmusic-api = { path = "../hmp-qqmusic-api" }
hmp-storage = { path = "../hmp-storage" }
rusqlite = { workspace = true }
hmp-media = { path = "../hmp-media" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
libc = "0.2"
url = "2"
notify = { workspace = true }

[target.'cfg(windows)'.dependencies]
hmp-smtc = { path = "../hmp-smtc" }

[features]
default = []
mpris = ["dep:hmp-mpris"]

[dev-dependencies]
tempfile = "3"
wiremock.workspace = true

[dependencies.hmp-mpris]
path = "../hmp-mpris"
optional = true
