[package]
name = "hmp-daemon"
description = "HMP 后台播放后端（服务 + tray）"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
hmp-core = { path = "../hmp-core" }
hmp-player = { path = "../hmp-player" }
hmp-qqmusic-api = { path = "../hmp-qqmusic-api" }
hmp-storage = { path = "../hmp-storage" }
rusqlite = { workspace = true }
hmp-media = { path = "../hmp-media" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
libc = "0.2"
url = "2"
percent-encoding = "2"
notify = { workspace = true }

[target.'cfg(windows)'.dependencies]
hmp-smtc = { path = "../hmp-smtc" }
# 托盘（feature `tray`）：Win32 原生实现；windows-sys 提供创建线程的
# 消息泵（tray-icon 的图标/菜单事件都经 Win32 消息送达）。
tray-icon = { version = "0.26", optional = true }
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
# 托盘（feature `tray`）：D-Bus StatusNotifierItem 实现。
# ksni 0.3 的 compat 层对 tokio/async-io 互斥 compile_error——而 Linux 侧
# zbus 5 被 keyring（zbus-secret-service）以默认 async-io 拉入、ksni/tokio
# 又置 zbus/tokio，feature unification 后必然双点亮爆炸（S11 CI 实证）。
# 解法：改用 blocking feature（纯同步 API，不声明任何 async 运行时
# feature），ksni_tray.rs 本就是自管线程同步实现，正好对口。
ksni = { version = "0.3", optional = true, default-features = false, features = ["blocking"] }

[features]
default = []
tray = ["dep:ksni", "dep:tray-icon"]
mpris = ["dep:hmp-mpris"]

[dev-dependencies]
tempfile = "3"
wiremock.workspace = true

[dependencies.hmp-mpris]
path = "../hmp-mpris"
optional = true
