[package]
name = "hmp-daemon"
description = "HMP 后台播放后端（服务 + tray）"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
hmp-core = { path = "../hmp-core" }
hmp-player = { path = "../hmp-player" }
hmp-qqmusic-api = { path = "../hmp-qqmusic-api" }
hmp-storage = { path = "../hmp-storage" }
rusqlite = { workspace = true }
hmp-media = { path = "../hmp-media" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
libc = "0.2"
url = "2"
percent-encoding = "2"
notify = { workspace = true }

[target.'cfg(windows)'.dependencies]
hmp-smtc = { path = "../hmp-smtc" }
# 托盘（feature `tray`）：Win32 原生实现；windows-sys 提供创建线程的
# 消息泵（tray-icon 的图标/菜单事件都经 Win32 消息送达）。
tray-icon = { version = "0.26", optional = true }
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
# 托盘（feature `tray`）：D-Bus StatusNotifierItem 实现。
# ksni 0.3（≥0.3.7 实证）compat 层强制 tokio/async-io 二选一：缺一或双亮
# 均 compile_error，纯 blocking 编不过。而 zbus 5 侧 keyring
# （zbus-secret-service→secret-service）已默认拉入 async-io，ksni/async-io
# 与之天然统一；若选 ksni/tokio 则 zbus 5 上双运行时并存，正是当年 S11
# unification 双亮爆炸的根源。blocking 纯同步 API，ksni_tray.rs 本就是
# 自管线程同步实现，正好对口。
ksni = { version = "0.3", optional = true, default-features = false, features = ["blocking", "async-io"] }

[features]
default = []
tray = ["dep:ksni", "dep:tray-icon"]
mpris = ["dep:hmp-mpris"]

[dev-dependencies]
tempfile = "3"
wiremock.workspace = true

[dependencies.hmp-mpris]
path = "../hmp-mpris"
optional = true
