[package]
name = "hmp-desktop"
description = "HMP 桌面应用：Slint UI（通透胡桃木设计语言）+ 应用编排"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[build-dependencies]
slint-build = "1.17"

[dependencies]
hmp-core = { path = "../hmp-core" }
hmp-daemon = { path = "../hmp-daemon" }
hmp-mpris = { path = "../hmp-mpris" }
hmp-player = { path = "../hmp-player" }
hmp-qqmusic-api = { path = "../hmp-qqmusic-api" }
hmp-storage = { path = "../hmp-storage" }
image = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
# SVG 图标经 slint-build 编译期栅格化（无需运行时 svg 特性）；
# resvg 供 covers.rs 运行时栅格化程序化封面；
# unstable-winit-030 = winit 句柄访问器（title-bar 拖动走系统级移动循环）
slint = { version = "1.17", features = ["unstable-winit-030"] }
resvg = "0.47"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
i-slint-backend-testing = { version = "1.17", features = ["renderer-software"] }
serial_test = "3"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
