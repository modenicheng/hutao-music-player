[package]
name = "hmp-player"
description = "HMP cross-platform audio player core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
hmp-core = { path = "../hmp-core" }
rodio = { version = "0.21.1", features = ["tracing"] }
stream-download = { version = "0.22.0", default-features = false, features = ["reqwest-rustls", "temp-storage"] }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tempfile = "3"
