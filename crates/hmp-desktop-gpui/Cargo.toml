[package]
name = "hmp-desktop-gpui"
description = "HMP GPUI desktop frontend prototype"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# GPUI view/runtime plus the demo's reusable shader and component libraries.
# All Git dependencies are pinned to one reviewed revision to avoid API drift.
gpui = { git = "https://github.com/cradiy/gpui.git", rev = "4c8abab1401d7369da55d9aab928c9405f0af309" }
gpui_effects = { git = "https://github.com/cradiy/gpui.git", rev = "4c8abab1401d7369da55d9aab928c9405f0af309" }
gpui_platform = { git = "https://github.com/cradiy/gpui.git", rev = "4c8abab1401d7369da55d9aab928c9405f0af309", features = ["font-kit", "wayland", "x11"] }
hmp-core = { path = "../hmp-core" }
hmp-desktop-common = { path = "../hmp-desktop-common" }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uic = { git = "https://github.com/cradiy/gpui.git", rev = "4c8abab1401d7369da55d9aab928c9405f0af309" }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
] }
