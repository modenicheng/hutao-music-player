name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # 原生依赖的 dev 包：GStreamer（hmp-player-gst）、dbus（ksni 托盘）、
      # fontconfig（slint 字体栈 fontique→yeslogic-fontconfig-sys）、
      # wayland（winit→wayland-backend client_system）。缺一个都会在
      # pkg-config 阶段失败（glib-2.0/gstreamer-player-1.0/dbus-1/fontconfig/wayland-client.pc）。
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglib2.0-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev \
            libdbus-1-dev libfontconfig1-dev libwayland-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 编译需 dev 包（gstreamer-player-1.0.pc / dbus-1.pc / fontconfig.pc /
      # wayland-client.pc）；运行时测试（e2e/player-gst）用 fakeaudiosink
      # （plugins-bad）+ playbin 解码 wav（plugins-good/base）。
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglib2.0-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev \
            libdbus-1-dev libfontconfig1-dev libwayland-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad
      - run: cargo test --workspace
      - run: cargo doc --no-deps --workspace

  windows-control:
    name: Windows control plane
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test Windows named-pipe transport
        run: cargo test -p hmp-control --all-targets
      - name: Type-check daemon and CLI Windows hosts
        env:
          DOCS_RS: "1"
        run: |
          cargo check -p hmp-daemon --no-default-features --all-targets
          cargo check -p hmp-cli --all-targets
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/hmp-tauri/pnpm-lock.yaml
      - run: corepack enable
      - name: Test and build the WebView controller
        working-directory: apps/hmp-tauri
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build

  deny:
    name: deny
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
