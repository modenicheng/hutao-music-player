name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # 原生依赖的 dev 包：alsa（rodio→cpal→alsa-sys 音频输出，ubuntu-24.04
      # runner 镜像不预装，缺它整个构建在 alsa-sys build script 挂）、
      # dbus（ksni 托盘）、gtk-3（tray-icon Linux 侧→gtk-sys 走
      # system-deps/pkg-config）、fontconfig（slint 字体栈
      # fontique→yeslogic-fontconfig-sys）、wayland（winit→wayland-backend
      # client_system）。缺一个都会在 pkg-config 阶段失败（alsa.pc /
      # dbus-1.pc / gtk+-3.0.pc / fontconfig.pc / wayland-client.pc）。
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev \
            libdbus-1-dev libgtk-3-dev libfontconfig1-dev libwayland-dev
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 编译需 dev 包（alsa.pc / dbus-1.pc / gtk+-3.0.pc / fontconfig.pc /
      # wayland-client.pc），清单与 clippy job 保持一致。
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev \
            libdbus-1-dev libgtk-3-dev libfontconfig1-dev libwayland-dev
      - run: cargo test --workspace
      - run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: "-D warnings"

  check-windows:
    name: check (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Windows 编译面首次进 CI：hmp-smtc 全 crate、daemon transport 命名管道
      # 分支、hmp-desktop Known Folders/prefs Windows 路径（PORTING「Windows
      # 适配」章的机器背书）。全局 RUSTFLAGS "-D warnings" 生效 → cfg(windows)
      # 的 warning 即 fail。首版只 check：clippy 冷缓存（slint + windows-rs）
      # 预计 15-25 分钟，待 check 稳定后二期评估；fmt 与平台无关，ubuntu 已覆盖。
      - run: cargo check --workspace --all-targets

  msrv:
    name: msrv (1.85)
    runs-on: ubuntu-latest
    # 暂缓 blocking（continue-on-error）：本机实测 cargo +1.85.0 check
    # --workspace --all-targets 退出 101——Cargo.lock 的 slint 1.17.1 链
    # （const-field-offset 0.2.x 全系 MSRV 1.88）与 zbus 家族（1.87）使
    # rust-version = "1.85" 声明与当前依赖集矛盾，待项目决策：升 MSRV
    # 1.88 需重估 deny.toml 的 MSRV 相关 RUSTSEC ignore（time / zbus_xml
    # 等锁旧版本的前提将失效）。决策落地前此 job 仅作探针不挡合并。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev \
            libdbus-1-dev libgtk-3-dev libfontconfig1-dev libwayland-dev
      - run: cargo check --workspace --all-targets

  deny:
    name: deny
    runs-on: ubuntu-latest
    # 2026-10 起 blocking：main 最近 run（cargo-deny-action 步骤级）持续全绿，
    # deny.toml 维持成熟的 RUSTSEC ignore 纪律；上游新通报变红即 blocking 本意。
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
